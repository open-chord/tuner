name: iOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test tuning core
        run: swift test
      - name: Build and test
        run: >-
          xcodebuild test
          -project Tuner.xcodeproj
          -scheme Tuner
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
